name: Non-live copy intent guard

on:
  pull_request:
    paths:
      - "app/credit/**"
      - "app/bank/**"
      - "app/(bank)/**"
      - "tools/ci/validate-copy-intent.js"
      - ".github/workflows/copy-intent-guard.yml"

permissions:
  contents: read

jobs:
  copy-intent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Reject undeclared non-live copy changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node tools/ci/validate-copy-intent.js
